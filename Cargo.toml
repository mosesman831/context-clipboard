[workspace]
resolver = "2"
members = [
    "crates/clipboard-core",
    "crates/clipboard-daemon",
    "crates/clipboard-ui",
]
default-members = [
    "crates/clipboard-core",
    "crates/clipboard-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mosesman831/context-clipboard"
authors = ["LatticeAG"]

[workspace.dependencies]
clipboard-core = { path = "crates/clipboard-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
arboard = "3"
libc = "0.2"
x11rb = "0.13"
image = "0.25"
